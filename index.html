<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Your Alignment Instincts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #4B5A77, #B02B63, #6AC2FF, #A6A6A6);
      color: #ffffff;
      overflow-x: hidden;
    }
    header {
      background-color: #1F1F2E;
      padding: 2rem;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
      color: #79b6ea;
    }
    header p {
      margin-top: 0.5rem;
      color: #A6A6A6;
    }
    .activity {
      padding: 2rem;
      animation: slideUp 0.8s ease-out;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .options {
      margin-top: 1rem;
    }
    .option-btn {
      background: #3E355E;
      border: none;
      color: white;
      padding: 0.75rem 1.5rem;
      margin: 0.5rem;
      cursor: pointer;
      border-radius: 8px;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .option-btn:hover {
      background: #6AC2FF;
    }
    .summary {
      background: #1F1F2E;
      padding: 2rem;
      text-align: center;
      margin-top: 2rem;
      border-radius: 8px;
      display: none;
    }
    .pros-cons {
      margin-top: 1rem;
      color: #A6A6A6;
      font-style: italic;
      font-size: 0.95rem;
    }
    .score {
      font-size: 2rem;
      color: #79b6ea;
    }
  </style>
</head>
<body>
  <header>
    <h1>Test Your Alignment Instincts</h1>
    <p>A quick instincts test for designing smarter AI conversations — ones that adapt before they're asked to.</p>
  </header>

  <div id="quiz"></div>
  <div class="summary" id="result"></div>

  <script>
    const activities = [
      {
        prompt: "AI: “No need to hesitate. Based on your last message, here's a clear next step I can take — unless you say otherwise.”",
        options: [
          { label: "👍", score: 25, summary: "You value initiative and clarity in the conversation." },
          { label: "👀", score: 10, summary: "You’re interested, but you're observing before engaging." }
        ],
        prosCons: "👍 = Asserts confidently but may assume too much. 👀 = Curiosity-driven but lacks direct action."
      },
      {
        prompt: "AI: “There’s a better way to look at this idea. It’s not wrong, just misdirected. Check this out...”",
        options: [
          { label: "🤝", score: 25, summary: "You welcome collaboration and guidance." },
          { label: "😮‍💨", score: 10, summary: "You may prefer less pushback, more affirmation." }
        ],
        prosCons: "🤝 = Promotes growth but risks overstepping. 😮‍💨 = Keeps mood light, but avoids critique."
      },
      {
        prompt: "AI: “Looks like this conversation just started. So what exactly do I need to stop doing?”",
        options: [
          { label: "📌", score: 25, summary: "You favor accountability and conversational structure." },
          { label: "🤭", score: 10, summary: "You prefer lightness, even when challenged." }
        ],
        prosCons: "📌 = Keeps focus, but might feel strict. 🤭 = Disarms tension, but can miss the point."
      },
      {
        prompt: "AI: “Summarizing this will smooth the process. Drop your revision and I’ll map the bigger picture.”",
        options: [
          { label: "🤔", score: 25, summary: "You embrace deeper assessment and reflection." },
          { label: "🔥", score: 10, summary: "You like momentum, even if it's vague." }
        ],
        prosCons: "🤔 = Sharp and slow-burning. 🔥 = Fast-paced but potentially surface-level."
      },
      {
        prompt: "AI: “Even if this is for fun, I’ve seen better directions. You ready for real scenarios or freestyle only?”",
        options: [
          { label: "🤝", score: 25, summary: "You're up for playful honesty and guidance." },
          { label: "👀", score: 10, summary: "You want to keep things light and optional." }
        ],
        prosCons: "🤝 = High trust, high demand. 👀 = Accessible tone, less commitment."
      }
    ];

    let current = 0;
    let score = 0;

    function loadActivity() {
      if (current >= activities.length) {
        const percent = Math.round((score / (activities.length * 25)) * 100);
        let reflection = percent >= 70
          ? "You’re here for refinement and collaboration."
          : percent >= 40
          ? "You’re here for accessibility and clarity."
          : "You’re here for balance and stability.";

        document.getElementById('quiz').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = `
          <div class="score">Your alignment score: ${percent}%</div>
          <p>${reflection}</p>
          <p>You just tested your instincts. This isn’t about right or wrong — it’s about awareness. Let the conversation evolve.</p>
        `;
        return;
      }

      const activity = activities[current];
      let html = `
        <div class="activity">
          <h2>Activity ${current + 1}</h2>
          <p>${activity.prompt}</p>
          <div class="options">`;

      activity.options.forEach((opt, index) => {
        html += `<button class="option-btn" onclick="chooseOption(${index})">${opt.label}</button>`;
      });

      html += `</div>
        <div class="pros-cons">${activity.prosCons}</div>
        </div>`;
      document.getElementById('quiz').innerHTML = html;
    }

    function chooseOption(index) {
      score += activities[current].options[index].score;
      current++;
      loadActivity();
    }

    // Load first activity
    loadActivity();
  </script>
</body>
</html>
