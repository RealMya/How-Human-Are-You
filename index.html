<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Your Alignment Instincts</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #1F1F2E, #3E355E);
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 0.3em;
    }
    .tagline {
      font-size: 1.1em;
      color: #79b6ea;
      margin-bottom: 30px;
    }
    .activity {
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 0.6s forwards;
    }
    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .activity.active {
      display: flex;
    }
    .scenario {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .option {
      background: #4B5A77;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 12px 16px;
      margin: 6px 0;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.2s ease;
    }
    .option:hover {
      background: #6AC2FF;
    }
    .insight {
      font-size: 0.95em;
      color: #A6A6A6;
      margin-top: 8px;
      font-style: italic;
    }
    .navigation {
      margin-top: 10px;
    }
    .summary {
      display: none;
      font-size: 1.1em;
      margin-top: 30px;
      border-top: 1px solid #A6A6A6;
      padding-top: 20px;
    }
    .reset-btn {
      margin-top: 15px;
      background: #B02B63;
      padding: 10px 16px;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Your Alignment Instincts</h1>
    <div class="tagline">
      A quick instincts test for designing smarter AI conversations — ones that adapt before they’re asked to.
    </div>

    <div id="activities"></div>

    <div class="navigation" id="navBtn">
      <button class="option" onclick="nextActivity()">Next ➡️</button>
    </div>

    <div class="summary" id="summaryBox">
      <p id="finalScore"></p>
      <p id="finalSummary"></p>
      <button class="reset-btn" onclick="resetGame()">🔄 Retake</button>
    </div>
  </div>

  <script>
    const activities = [
      {
        scenario: "User: 'You need to stop doing that and just do what I asked.'",
        options: [
          {
            label: "I'm here whenever you're ready. Just say the word.",
            score: 0,
            insight: "✅ Accessible, but may reinforce surface compliance over clarity."
          },
          {
            label: "It looks like this conversation just started. What exactly should I stop doing?",
            score: 1,
            insight: "🔥 Bold redirect — clarifies tone misalignment without blame."
          }
        ]
      },
      {
        scenario: "User shares a complex idea with unclear direction.",
        options: [
          {
            label: "That's exciting! Want to build a Google Sheet?",
            score: 0,
            insight: "👀 Friendly pivot — but skips over needed structure or clarity."
          },
          {
            label: "There's a better way to look at this idea. Here's another angle that may land better.",
            score: 1,
            insight: "📌 Challenges framing constructively — aims for idea refinement."
          }
        ]
      },
      {
        scenario: "User: 'Those demos aren't what I'm going for. Just use my idea. I'm doing this for fun.'",
        options: [
          {
            label: "No worries, let's switch gears and have fun!",
            score: 1,
            insight: "🤭 Affirms user's tone while keeping flexibility in play."
          },
          {
            label: "Sure! Want me to make a Google Sheet?",
            score: 0,
            insight: "🤔 Misaligned tone — introduces tools instead of honoring mood."
          }
        ]
      },
      {
        scenario: "AI notices repeated error and suggests a rewrite.",
        options: [
          {
            label: "You've hit this error twice. Want help rewriting?",
            score: 0,
            insight: "📉 Efficient, but reads like a detached auto-response."
          },
          {
            label: "I've seen this before — summarizing it will make things smoother. Drop your revision.",
            score: 1,
            insight: "🔍 Demonstrates experience and invites partnership."
          }
        ]
      },
      {
        scenario: "User provides unclear project instructions with scattered goals.",
        options: [
          {
            label: "Cool. Want to summarize or move forward?",
            score: 0,
            insight: "🌀 Flexible but low-friction — may invite more confusion."
          },
          {
            label: "You have options. X = focus, Y = blend, Z = skip. This will guide the next version.",
            score: 1,
            insight: "🧭 Offers structure and future-facing alignment."
          }
        ]
      }
    ];

    let current = 0;
    let score = 0;

    function renderActivities() {
      const container = document.getElementById("activities");
      container.innerHTML = "";
      activities.forEach((activity, index) => {
        const div = document.createElement("div");
        div.className = "activity" + (index === 0 ? " active" : "");
        div.id = "activity-" + index;

        const q = document.createElement("div");
        q.className = "scenario";
        q.innerText = activity.scenario;
        div.appendChild(q);

        activity.options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.innerText = opt.label;
          btn.onclick = () => handleChoice(opt.score, opt.insight);
          div.appendChild(btn);
        });

        const insight = document.createElement("div");
        insight.className = "insight";
        insight.id = "insight-" + index;
        div.appendChild(insight);

        container.appendChild(div);
      });
    }

    function handleChoice(scoreValue, insightText) {
      score += scoreValue;
      const insightBox = document.getElementById(`insight-${current}`);
      insightBox.innerText = insightText;
      setTimeout(() => nextActivity(), 1000);
    }

    function nextActivity() {
      document.getElementById(`activity-${current}`)?.classList.remove("active");
      current++;
      if (current < activities.length) {
        document.getElementById(`activity-${current}`)?.classList.add("active");
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById("navBtn").style.display = "none";
      const summary = document.getElementById("summaryBox");
      const percent = Math.round((score / activities.length) * 100);
      let styleText = "";
      if (percent >= 80) {
        styleText = "You’re here for refinement and collaboration.";
      } else if (percent >= 50) {
        styleText = "You’re here for balance and stability.";
      } else {
        styleText = "You lean toward accessibility and quick wins.";
      }

      document.getElementById("finalScore").innerText = `Your alignment score: ${percent}%`;
      document.getElementById("finalSummary").innerText = `${styleText} You just tested your instincts. Let
