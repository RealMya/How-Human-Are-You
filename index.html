<head>

<title>Test Your Alignment Instincts</title>
<style>
  body {

    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0; padding: 2rem;
    display: flex;
    justify-content: center;
  }
  @keyframes gradientShift {
    0%{background-position:0% 50%;}

    100%{background-position:0% 50%;}
  }
  .container {
    max-width: 600px;
    background: #1F1F2E;

    box-shadow: 0 0 20px #79b6ea55;
  }

    font-weight: 700;
  }

  }

    background: #3E355E;
    margin-bottom: 2rem;
    padding: 1rem 1.5rem;
    border-radius: 10px;

    transform: translateY(20px);
    transition: all 0.5s ease;
    display: none;
  }
  .activity.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }
  .question {

    color: #79b6ea;
    transition: background 0.3s ease, color 0.3s ease;
  }
  button.emoji-btn:hover {
    background: #79b6ea;
    color: #1F1F2E;

  button.emoji-btn.selected {
    background: #79b6ea;
    color: #1F1F2E;
  }

    font-style: italic;
    margin-top: 0.5rem;
  }
  .summary {
    background: #3E355E;
    padding: 1.5rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1.1rem;
    text-align: center;
  }
  .score {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    color: #79b6ea;
  }
</style>
</head>
