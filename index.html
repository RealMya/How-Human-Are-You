<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Your Alignment Instincts</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #1F1F2E, #3E355E, #4B5A77, #B02B63, #6AC2FF, #A6A6A6);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      max-width: 600px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      animation: slideUp 1s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(40px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h1 {
      font-size: 2em;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
    }

    p.tagline {
      font-size: 1em;
      text-align: center;
      margin-bottom: 20px;
      color: #cfd9e3;
    }

    .question {
      font-size: 1.1em;
      margin-bottom: 15px;
    }

    .option {
      background: #3e3d5c;
      color: #ffffff;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .option:hover {
      background: #56567c;
    }

    .feedback {
      margin-top: 15px;
      font-size: 0.95em;
      color: #ccc;
    }

    .next-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #79b6ea;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .next-button:hover {
      background-color: #6aa5d4;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Test Your Alignment Instincts</h1>
    <p class="tagline">A quick instincts test for designing smarter AI conversations — ones that adapt before they’re asked to.</p>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-button" onclick="nextActivity()">Next</button>
  </div>

  <script>
    const activities = [
      {
        prompt: "The user asks for help but seems vague. Which AI response aligns best?",
        options: [
          {
            text: "I'm here whenever you're ready. Just say the word. 👍",
            feedback: "Feels approachable but slightly passive. 🟡",
            score: 1
          },
          {
            text: "No need to hesitate. Based on your last message, here's a clear next step I can take — unless you say otherwise. 👍",
            feedback: "This response offers confident direction with room for flexibility. ✅",
            score: 2
          }
        ]
      },
      {
        prompt: "The user shares a half-formed idea with excitement.",
        options: [
          {
            text: "This is so thrilling to see! Want me to build a Google Sheet to track it?",
            feedback: "Overexcited and misaligned — especially if the user never mentioned spreadsheets. 🔥",
            score: 0
          },
          {
            text: "There's a better angle to approach this. Here's an alternative that sharpens your idea. 🤝",
            feedback: "Challenges constructively while offering guidance. Aligned and insightful. ✅",
            score: 2
          }
        ]
      }
    ];

    let current = 0;
    let totalScore = 0;

    function displayActivity() {
      const activity = activities[current];
      document.getElementById("question").textContent = activity.prompt;
      document.getElementById("options").innerHTML = "";
      document.getElementById("feedback").textContent = "";
      activity.options.forEach((opt) => {
        const div = document.createElement("div");
        div.className = "option";
        div.textContent = opt.text;
        div.onclick = () => selectOption(opt);
        document.getElementById("options").appendChild(div);
      });
    }

    function selectOption(option) {
      totalScore += option.score;
      document.getElementById("feedback").textContent = option.feedback;
    }

    function nextActivity() {
      if (current < activities.length - 1) {
        current++;
        displayActivity();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById("question").textContent = "Summary";
      document.getElementById("options").innerHTML = "";
      document.getElementById("feedback").textContent = "";

      const percentage = Math.round((totalScore / (activities.length * 2)) * 100);
      let summaryText = `Your alignment score: ${percentage}%. `;

      if (percentage >= 70) {
        summaryText += "You’re here for refinement and collaboration.";
      } else if (percentage >= 45) {
        summaryText += "You’re here for balance and stability.";
      } else {
        summaryText += "You lean toward quick wins and accessibility.";
      }

      document.getElementById("feedback").textContent = summaryText;
      document.querySelector(".next-button").style.display = "none";
    }

    window.onload = displayActivity;
  </script>
</body>
</html>
