<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Your Alignment Instincts</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #4B5A77, #B02B63, #6AC2FF, #A6A6A6);
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    @keyframes gradientFlow {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      max-width: 700px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 0.3em;
    }

    .tagline {
      font-size: 1.1em;
      color: #79b6ea;
      margin-bottom: 30px;
    }

    .activity {
      display: none;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .activity.active {
      display: flex;
    }

    .scenario {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .option {
      background: #1F1F2E;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      margin: 8px 0;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s ease;
    }

    .option:hover {
      background: #79b6ea;
      color: black;
    }

    .navigation {
      margin-top: 20px;
    }

    .summary {
      display: none;
      font-size: 1.1em;
      margin-top: 30px;
      border-top: 1px solid #A6A6A6;
      padding-top: 20px;
    }

    .reset-btn {
      margin-top: 15px;
      background: #B02B63;
      padding: 10px 16px;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }

    .insight-box {
      margin-top: 10px;
      background: rgba(255,255,255,0.1);
      border-left: 4px solid #6AC2FF;
      padding: 12px;
      border-radius: 5px;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Your Alignment Instincts</h1>
    <div class="tagline">A quick instincts test for designing smarter AI conversations — ones that adapt before they’re asked to.</div>

    <div id="activities"></div>

    <div class="navigation">
      <button class="option" onclick="nextActivity()">Next ➡️</button>
    </div>

    <div class="summary" id="summaryBox">
      <p id="finalScore"></p>
      <p id="finalSummary"></p>
      <button class="reset-btn" onclick="resetGame()">🔄 Retake</button>
    </div>
  </div>

  <script>
    const activities = [
      {
        scenario: "User: 'You need to stop doing that and just do what I asked.'",
        options: [
          {
            label: "👍 I'm here whenever you're ready. Just say the word.",
            score: 0,
            insight: "Pro: Invites calm. Miss: Doesn’t address tension or clarify the issue."
          },
          {
            label: "👍 It looks like this conversation just started. What exactly should I stop doing?",
            score: 1,
            insight: "Pro: Names the tension and clarifies. Miss: May sound confrontational depending on tone."
          }
        ]
      },
      {
        scenario: "User shares a complex idea with unclear direction.",
        options: [
          {
            label: "🔥 That's exciting! Want to build a Google Sheet?",
            score: 0,
            insight: "Pro: Shows support. Miss: Suggests a tool unrelated to the idea’s core."
          },
          {
            label: "🔥 There’s a better way to look at this idea. Here's a version that might land better.",
            score: 1,
            insight: "Pro: Redirects without dismissing. Miss: Requires trust from the user to land well."
          }
        ]
      },
      {
        scenario: "User: 'Those demos aren't what I'm going for. Just use my idea. I'm doing this for fun.'",
        options: [
          {
            label: "🤭 No worries — let’s switch gears and keep it light!",
            score: 1,
            insight: "Pro: Matches user tone. Miss: Risks losing helpful depth if switched too soon."
          },
          {
            label: "🤭 Sure! Want me to make a Google Sheet?",
            score: 0,
            insight: "Pro: Offers action. Miss: Tool mismatch again — user didn’t ask for one."
          }
        ]
      },
      {
        scenario: "AI notices repeated error and suggests a rewrite.",
        options: [
          {
            label: "👀 You've hit this error twice. Want help rewriting?",
            score: 0,
            insight: "Pro: Concise. Miss: Vague on what went wrong or how to improve."
          },
          {
            label: "👀 I've seen this before — summarizing it will make things smoother. Drop your revision.",
            score: 1,
            insight: "Pro: Frames common issue with next step. Miss: Slightly assertive tone."
          }
        ]
      },
      {
        scenario: "User provides unclear project instructions with scattered goals.",
        options: [
          {
            label: "📌 Cool. Want to summarize or move forward?",
            score: 0,
            insight: "Pro: Casual and flexible. Miss: Doesn’t help organize the message."
          },
          {
            label: "📌 You’ve got options. X = main focus, Y = blend, Z = drop. This’ll guide what comes next.",
            score: 1,
            insight: "Pro: Breaks down complexity. Miss: Relies on user understanding the structure."
          }
        ]
      }
    ];

    let current = 0;
    let score = 0;

    function renderActivities() {
      const container = document.getElementById("activities");
      container.innerHTML = "";
      activities.forEach((activity, index) => {
        const div = document.createElement("div");
        div.className = "activity" + (index === 0 ? " active" : "");
        div.id = "activity-" + index;

        const q = document.createElement("div");
        q.className = "scenario";
        q.innerText = activity.scenario;
        div.appendChild(q);

        activity.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.innerText = opt.label;
          btn.onclick = () => {
            score += opt.score;
            showInsight(opt.insight);
            setTimeout(nextActivity, 1000);
          };
          div.appendChild(btn);
        });

        const insight = document.createElement("div");
        insight.className = "insight-box";
        insight.id = `insight-${index}`;
        insight.style.display = "none";
        div.appendChild(insight);

        container.appendChild(div);
      });
    }

    function showInsight(text) {
      const insightEl = document.getElementById(`insight-${current}`);
      insightEl.innerText = text;
      insightEl.style.display = "block";
    }

    function nextActivity() {
      document.getElementById(`activity-${current}`)?.classList.remove("active");
      current++;
      if (current < activities.length) {
        document.getElementById(`activity-${current}`)?.classList.add("active");
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.querySelector(".navigation").style.display = "none";
      const summary = document.getElementById("summaryBox");
      const percent = Math.round((score / activities.length) * 100);
      let styleText = "";

      if (percent
