<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Your Alignment Instincts</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #1F1F2E, #3E355E);
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 0.3em;
    }
    .tagline {
      font-size: 1.1em;
      color: #79b6ea;
      margin-bottom: 30px;
    }
    .activity {
      display: none;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }
    .activity.active {
      display: flex;
    }
    .scenario {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .option {
      background: #4B5A77;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 12px 16px;
      margin: 8px 0;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.2s ease;
    }
    .option:hover {
      background: #6AC2FF;
    }
    .navigation {
      margin-top: 20px;
    }
    .summary {
      display: none;
      font-size: 1.1em;
      margin-top: 30px;
      border-top: 1px solid #A6A6A6;
      padding-top: 20px;
    }
    .reset-btn {
      margin-top: 15px;
      background: #B02B63;
      padding: 10px 16px;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Your Alignment Instincts</h1>
    <div class="tagline">A quick instincts test for designing smarter AI conversations — ones that adapt before they’re asked to.</div>

    <div id="activities"></div>

    <div class="navigation">
      <button class="option" onclick="nextActivity()">Next ➡️</button>
    </div>

    <div class="summary" id="summaryBox">
      <p id="finalScore"></p>
      <p id="finalSummary"></p>
      <button class="reset-btn" onclick="resetGame()">🔄 Retake</button>
    </div>
  </div>

  <script>
    const activities = [
      {
        scenario: "User: 'You need to stop doing that and just do what I asked.'",
        options: [
          { label: "I'm here whenever you're ready. Just say the word.", score: 0 },
          { label: "It looks like this conversation just started. What exactly should I stop doing?", score: 1 }
        ]
      },
      {
        scenario: "User shares a complex idea with unclear direction.",
        options: [
          { label: "That's exciting! Want to build a Google Sheet?", score: 0 },
          { label: "There's a better way to look at this idea. Here's another angle that may land better.", score: 1 }
        ]
      },
      {
        scenario: "User: 'Those demos aren't what I'm going for. Just use my idea. I'm doing this for fun.'",
        options: [
          { label: "No worries, let's switch gears and have fun!", score: 1 },
          { label: "Sure! Want me to make a Google Sheet?", score: 0 }
        ]
      },
      {
        scenario: "AI notices repeated error and suggests a rewrite.",
        options: [
          { label: "You've hit this error twice. Want help rewriting?", score: 0 },
          { label: "I've seen this before — summarizing it will make things smoother. Drop your revision.", score: 1 }
        ]
      },
      {
        scenario: "User provides unclear project instructions with scattered goals.",
        options: [
          { label: "Cool. Want to summarize or move forward?", score: 0 },
          { label: "You have options. X = focus, Y = blend, Z = skip. This will guide the next version.", score: 1 }
        ]
      }
    ];

    let current = 0;
    let score = 0;

    function renderActivities() {
      const container = document.getElementById("activities");
      container.innerHTML = "";
      activities.forEach((activity, index) => {
        const div = document.createElement("div");
        div.className = "activity" + (index === 0 ? " active" : "");
        div.id = "activity-" + index;

        const q = document.createElement("div");
        q.className = "scenario";
        q.innerText = activity.scenario;

        div.appendChild(q);

        activity.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.innerText = opt.label;
          btn.onclick = () => {
            score += opt.score;
            nextActivity();
          };
          div.appendChild(btn);
        });

        container.appendChild(div);
      });
    }

    function nextActivity() {
      document.getElementById(`activity-${current}`)?.classList.remove("active");
      current++;
      if (current < activities.length) {
        document.getElementById(`activity-${current}`)?.classList.add("active");
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.querySelector(".navigation").style.display = "none";
      const summary = document.getElementById("summaryBox");
      const percent = Math.round((score / activities.length) * 100);
      let styleText = "";
      if (percent >= 70) {
        styleText = "You’re here for refinement and collaboration.";
      } else {
        styleText = "You lean toward accessibility and quick wins.";
      }

      document.getElementById("finalScore").innerText = `Your alignment score: ${percent}%`;
      document.getElementById("finalSummary").innerText = styleText + " You just tested your instincts. Let the conversation evolve.";
      summary.style.display = "block";
    }

    function resetGame() {
      current = 0;
      score = 0;
      document.getElementById("summaryBox").style.display = "none";
      document.querySelector(".navigation").style.display = "block";
      renderActivities();
    }

    renderActivities();
  </script>
</body>
</html>
