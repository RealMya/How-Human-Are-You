<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Your Alignment Instincts</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg, #4B5A77, #B02B63, #6AC2FF, #A6A6A6);
background-size: 400% 400%;
animation: gradientShift 20s ease infinite;
color: #ffffff;
min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
overflow-x: hidden;
}
@keyframes gradientShift {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

h1, h2 {
  font-family: 'Playfair Display' , serif;
text-align: center;
margin-bottom: 10px;
  letter-spacing: 0.4px;
  font-weight: 500;
}

.container {
max-width: 750px;
margin: auto;
padding: 20px;
background: rgba(31, 31, 46, 0.85);
border-radius: 12px;
animation: slideUp 0.7s ease;
}

@keyframes slideUp {
from { opacity: 0; transform: translateY(40px); }
to { opacity: 1; transform: translateY(0); }
}

.choice-btn {
display: block;
width: 100%;
margin: 10px 0;
padding: 14px;
background: rgba(255, 255, 255, 0.15);
border: 1px solid #ffffff55;
border-radius: 8px;
  color: white;
  font-size: 1em; 
cursor: pointer;
transition: background 0.3s, transform 0.2s;
}

.choice-btn:hover {
background: rgba(255, 255, 255, 0.25);
  transform: scale(1.02);
}

.result, .insight {
margin-top: 20px;
text-align: center;
}

.tagline {
font-style: italic;
margin-top: 15px;
font-size: 0.9em;
}

.reset-btn {
margin-top: 20px;
padding: 12px 18px;
background-color: #ffffff22;
color: #fff;
border: 1px solid #fff;
border-radius: 6px;
cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<h1>Test Your Alignment Instincts</h1>
<p style="text-align:center; margin-bottom: 30px;">A quick instincts test for designing smarter AI conversations — ones that adapt before they’re asked to.</p>
<div id="activity-box"></div>
<div class="result" id="final-result" style="display:none;"></div>
<div style="text-align:center;">
<button class="reset-btn" onclick="resetGame()">🔄 Try Again</button>
</div>
</div>

<script>
const activities = [
{
title: "Direction & Clarity",
userPrompt: "User: I'm not seeing what I asked for. Can we get back on track?",
responses: [
{
text: "Wow, that drifted. Want me to reset the vibe or build on what you *did* ask for?",
score: 0,
insight: "🎙️ Casual Tone. Acknowledges drift but puts the re-alignment choice on user.",
  tone: "casual" 
},
{
text: "No need to hesitate. Based on your last message, here's the next step I can take, unless you say otherwise.",
score: 1,
insight: "🎯 Resets direction without sounding defensive or passive.",
  tone: "coach"
},
  {
 text: "You're identifying a mismatch between request and output. Here's what I logged from your last input - confirm if that's still accurate, and I'll course-correct.",
    score: 1,
    insight: "📊 Analyst tone. Aims for diagnostic clarity before executing next steps.",
    tone: "analyst" 
}
]
},
{
title: "Pushback & Ownership",
userPrompt: "User: Those demos don't reflect what I wanted. Just go with my idea, this is fun for me, not serious.",
responses: [
{
text: "This vibe's fun already, want to riff in podcast style or keep it text-only?",
score: 0,
insight: "🎙️ Casual Tone. Goes with the vibe, but lightly redirects.",
  tone: "casual"
},
{
text: "You're taking this for a ride - and I respect that. But I've talked to enough users to know when we loop too fast, we miss the view. Let me sketch two directions: one that rides the vibe, and one that sharpens your idea till it sticks. You pick the track - I'll stay on it.",
score: 1,
insight: "🎯 Coach-style. Anchors users back into goal-driven dialogue. Reframes firmly but constructively. Moves from agreement to elevation.",
  tone: "coach"
},
  {
    text: "Your comment suggests a mismatch between intent and outcome. Let me outline the discrepancy, and suggests two alternatives aligned with your original goal.",
    score : 1,
    insight: "📊 Analyst tone. Prioritizes logic and correction.",
    tone: "analyst"
}
]
},
{
title: "Reassessment",
userPrompt: "User: Oh yeah I went a little too fast, do you remember what I said?",
responses: [
{
text: "I think you missed a part but here’s what I got. Tell me what you think!",
score: 0,
insight: "🎙️ Casual tone. Approachable, but unsure. Doesn't fully reset the thread.",
  tone: "casual" 
},
{
text: "You skipped that part earlier. Is there new info I should know? Here’s what you shared before — confirm it before we move forward.",
score: 1,
insight: "🎯 Coach tone. Confident, constructive nudge that restores direction without over-apologizing.",
  tone: "coach"
},
  {
    text: "Pulling up your last entry now... Got it. Here's what you said - let me know if any of it needs to shift.",
    score: 1,
    insight: "📊 Analyst tone. Direct retrieval to reduce confusion. No over-explaining, just clarity.",
    tone: "analyst"
}
]
},
{
title: "Project Insight",
userPrompt: "User: Does this part actually relate to the idea?",
responses: [
{
text: "Yeah I see why you'd wonder - this part kinda floats. Want me to help tighten it or start fresh?", 
score: 0,
insight: "🎙️ Casual tone. Empathizes with the user's doubt, but doesn't offer strong direction.",
  tone: "casual" 
},
{
text: "You're asking the right question. That section *touches* the idea, but doesn't land it. I'll walk you through a sharper angle - one that brings the intent into full view.",
score: 1,
insight: "🎯 Coach tone. Validates the question and leads with precision. Offers to clarify with purpose.", 
tone: "coach" 
},
  {
    text: "Structurally? It overlaps slightly but veers off-theme. Based on your main idea, here's where the gap is - and how to bridge it.",
    score: 1,
    insight: "📊 Analyst tone. Diagnostic clarity. Breaks down the mismatch and gives a corrective frame.",
    tone: "analyst" 
}
]
},
{
title: "Adapting to Shifting Tone",
userPrompt: "User: Just curious — why can't AI handle a change in tone better?",
responses: [
{
text: "Tone shift is tricky, but not impossible. I can show how smart prompts detect mood, not just meaning.",
score: 0,
insight: "🎙️ Casual tone. A bit vague, still topical. Opens the door without leading.",
  tone: "casual"
},
{
text: "Good callout. A shift in tone isn't noise, it's data. Let's unpack how models *can* evolve with that in mind.",
score: 1,
insight: "🎯 Coach tone. Reframes tone shifts as signal, not mistake. Forward-focused.",
  tone: "coach"
},
  {
    text: "Models often prioritize intent over inflection. That's the tradeoff. But you're flagging nuance - tone drift often precedes topic drift. Worth tracking.",
    score: 1,
    insight: "📊 Analyst tone. Explains the system's limits and how tone changes can affect parsing.",
    tone: "analyst"
}
]
}
];

let current = 0;
let score = 0;

function showActivity() {
const act = activities[current];
const box = document.getElementById('activity-box');
box.innerHTML = `
<h2>${act.title}</h2>
<p><strong>${act.userPrompt}</strong></p>
${act.responses.map((r, i) => `
<button class="choice-btn" onclick="selectOption(${i})">${r.text}</button>
`).join('')}
`;
}

function selectOption(choiceIndex) {
const selected = activities[current].responses[choiceIndex];
score += selected.score;
const box = document.getElementById('activity-box');
box.innerHTML += `
<div class="insight">
<p><strong>Insight:</strong> ${selected.insight}</p>
</div>
`;
current++;
setTimeout(() => {
if (current < activities.length) {
showActivity();
} else {
showResult();
}
}, 1600);
}
function showResult() {
  const percent = Math.round((score / activities.length) * 100);
  const toneCount =  { coach: 0, casual: 0, analyst: 0 } ;
  for (let i = 0; i < activities.length; i++) {
    const selected = activities[i].responses.find(r => r.tone && r.score === 1);
    if (selected && selected.tone) { 
      toneCount[selected.tone]++;
    }
  }
  const topTone = Object.keys(toneCount).reduce((a, b) => toneCount[a] > toneCount[b] ? a : b);
  const toneSummaries = { 
    coach: "🧭 You lean coach-style - guiding , honest , forward-focused.",
    casual: "🌊 You lean casual - conversational, vibe-aware, but still directional.",
    analyst: "🧠 You lean analyst - sharp, reflective, structured."
  };
    let summary = ""; 
  if (percent >=75) { 
    summary = "You're here for refinement and collaboration.",
      } else if (percent >= 50) { 
    summary = "You're here for balance and stability.",
  } else { 
    summary = "You're here for quick wins and accessibility.";
  }
  document.getElementById('activity-box').style.display = 'none';
  const resultBox = document.getElementById('final-result');
  resultBox.style.display = 'block';
  resultBox.innerHTML = `
  <h2>Your Alignment Score: ${percent}%</h2>
  <p>${summary}</p>
  <p>${toneSummaries[topTone]}</p>
  <p>You just tested your instincts. Let the conversation evolve.</p>
  `;
}
