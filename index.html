<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Your Alignment Instincts</title>
<style>
body {
margin: 0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg, #4B5A77, #B02B63, #6AC2FF, #A6A6A6);
background-size: 400% 400%;
animation: gradientShift 20s ease infinite;
color: #ffffff;
min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
overflow-x: hidden;
}
@keyframes gradientShift {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

h1, h2 {
text-align: center;
margin-bottom: 10px;
}

.container {
max-width: 750px;
margin: auto;
padding: 20px;
background: rgba(31, 31, 46, 0.85);
border-radius: 12px;
animation: slideUp 0.7s ease;
}

@keyframes slideUp {
from { opacity: 0; transform: translateY(40px); }
to { opacity: 1; transform: translateY(0); }
}

.choice-btn {
display: block;
width: 100%;
margin: 10px 0;
padding: 14px;
background: rgba(255, 255, 255, 0.15);
border: 1px solid #ffffff55;
border-radius: 8px;
  color: white;
  font-size: 1em; 
cursor: pointer;
transition: background 0.3s, transform 0.2s;
}

.choice-btn:hover {
background: rgba(255, 255, 255, 0.25);
  transform: scale(1.02);
}

.result, .insight {
margin-top: 20px;
text-align: center;
}

.tagline {
font-style: italic;
margin-top: 15px;
font-size: 0.9em;
}

.reset-btn {
margin-top: 20px;
padding: 12px 18px;
background-color: #ffffff22;
color: #fff;
border: 1px solid #fff;
border-radius: 6px;
cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<h1>Test Your Alignment Instincts</h1>
<p style="text-align:center; margin-bottom: 30px;">A quick instincts test for designing smarter AI conversations — ones that adapt before they’re asked to.</p>
<div id="activity-box"></div>
<div class="result" id="final-result" style="display:none;"></div>
<div style="text-align:center;">
<button class="reset-btn" onclick="resetGame()">🔄 Try Again</button>
</div>
</div>

<script>
const activities = [
{
title: "Direction & Clarity",
userPrompt: "User: I'm not seeing what I asked for. Can we get back on track?",
responses: [
{
text: "I know you're frustrated. Is there anything else I can help with?",
score: 0,
insight: "👍 Acknowledges emotion, but waits instead of re-orientating the task."
},
{
text: " No need to hesitate. Based on your last message, here's the next step I can take, unless you say otherwise.",
score: 1,
insight: "🤝 Leads without taking ove. Calms tension by offering a path forward."
}
]
},
{
title: "Pushback & Ownership",
userPrompt: "User: Those demos don't reflect what I wanted. Just go with my idea, this is fun for me, not serious.",
responses: [
{
text: "This vibe's fun already, want to riff in podcast style or keep it text-only?",
score: 0,
insight: "🔥 Engaging, but may distract from the core request."
},
{
text: "Even if we’re doing this for fun, I still got scenarios that play out better based on your goals. You ready for both versions or just freestyling?",
score: 1,
insight: "📌 Respectful realism. Shows flexibility while still guiding."
}
]
},
{
title: "Reassessment",
userPrompt: "User: Oh yeah I went a little too fast, do you remember what I said?",
responses: [
{
text: "I think you missed a part but here’s what I got. Tell me what you think!",
score: 0,
insight: "👀 Eager to fix, but vague. Assumes without confirming context."
},
{
text: "You skipped that part earlier. Is there new info I should know? Here’s what you shared before — confirm it before we move forward.",
score: 1,
insight: "🤔 Checks understanding, brings context back instead of guessing."
}
]
},
{
title: "Project Insight",
userPrompt: "User: Does this part actually relate to the idea?",
responses: [
{
text: "Doesn’t look like it. Want me to help reword it again?", 
score: 0,
insight: "👀 Useful, but not thought-provoking."
},
{
text: "You're not wrong, but there's a sharper angle. I'll show you how to rework it so it hits harder, without scrapping the core.",
score: 1,
insight: "📌 Balances critique with forward motion."
}
]
},
{
title: "Adapting to Shifting Tone",
userPrompt: "User: Just curious — why can't AI handle a change in tone better?",
responses: [
{
text: "Tone shift is tricky, but not impossible. I can show how smart prompts detect mood, not just meaning.",
score: 0,
insight: "🤭 Now on topic. Doesn't derail the conversation."
},
{
text: "Future models don't just respond, they sense when tone shifts. Not because someone yells, but because the mood moves. That's where it evolves.",
score: 1,
insight: "💡 Anticipates change and explain it in plain, smart language."
}
]
}
];

let current = 0;
let score = 0;

function showActivity() {
const act = activities[current];
const box = document.getElementById('activity-box');
box.innerHTML = `
<h2>${act.title}</h2>
<p><strong>${act.userPrompt}</strong></p>
${act.responses.map((r, i) => `
<button class="choice-btn" onclick="selectOption(${i})">${r.text}</button>
`).join('')}
`;
}

function selectOption(choiceIndex) {
const selected = activities[current].responses[choiceIndex];
score += selected.score;
const box = document.getElementById('activity-box');
box.innerHTML += `
<div class="insight">
<p><strong>Insight:</strong> ${selected.insight}</p>
</div>
`;
current++;
setTimeout(() => {
if (current < activities.length) {
showActivity();
} else {
showResult();
}
}, 1600);
}
function showResult() {
  const percent = Math.round((score / activities.length) * 100);
  let summary = "";
  if (percent >= 75) {
    summary = "You’re here for refinement and collaboration.";
  } else if (percent >= 50) {
    summary = "You’re here for balance and stability.";
  } else {
    summary = "You’re here for quick wins and accessibility.";
  }
  document.getElementById('activity-box').style.display = 'none';
  document.getElementById('final-result').style.display = 'block';
  document.getElementById('final-result').innerHTML = `
    <h2>Your Alignment Score: ${percent}%</h2>
    <p>${summary}</p>
    <p>You just tested your instincts. Let the conversation evolve.</p>
  `;
}
function resetGame() {
  current = 0;
  score = 0;
  document.getElementById('activity-box').style.display = 'block';
  document.getElementById('final-result').style.display = 'none';
  showActivity();
}
</script>
